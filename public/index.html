<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Security System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <div class="status">
                <span class="status-dot"></span>
                SECURE CHANNEL
            </div>

            <h1>OTP Security System</h1>

            <p class="intro">
                Secure one-time verification, delivered directly to your inbox.
            </p>
        </header>

        <div class="security-grid">

            <section class="card">
                <div class="card-header">
                    <span class="card-number">01</span>
                    <h2>Send OTP</h2>
                </div>

                <p class="card-description">
                    Request a one-time verification code using your email address.
                </p>

                <label for="sendEmail">Email address</label>

                <input
                    type="email"
                    id="sendEmail"
                    placeholder="you@example.com"
                >

                <div class="button-row">
                    <button id="sendOtp">Send OTP</button>
                    <button id="resendOtp" class="secondary-button">Resend</button>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <span class="card-number">02</span>
                    <h2>Verify OTP</h2>
                </div>

                <p class="card-description">
                    Enter the six-digit code sent to your email address.
                </p>

                <label for="verifyEmail">Email address</label>

                <input
                    type="email"
                    id="verifyEmail"
                    placeholder="you@example.com"
                >

                <label for="otp">Verification code</label>

                <input
                    type="text"
                    id="otp"
                    maxlength="6"
                    inputmode="numeric"
                    placeholder="000000"
                >

                <button id="verifyOtp" class="verify-button">
                    Verify Code
                </button>
            </section>

        </div>

        <footer class="app-footer">
            <span>OTP SECURITY</span>
            <span>6 DIGITS · TIME LIMITED</span>
        </footer>

        <div id="notification"></div>

        <p id="message"></p>

    </main>
<script src="script.js"></script>
</body>
</html>
