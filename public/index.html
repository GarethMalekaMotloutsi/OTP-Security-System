<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Security System</title>
</head>
<body>

    <h1>OTP Security System</h1>

    <section>
        <h2>Send OTP</h2>

        <label for="sendEmail">Email:</label>
        <input type="email" id="sendEmail" placeholder="Enter your email">

        <button id="sendOtp">Send OTP</button>
        <button id="resendOtp">Resend OTP</button>
    </section>

    <section>
        <h2>Verify OTP</h2>

        <label for="verifyEmail">Email:</label>
        <input type="email" id="verifyEmail" placeholder="Enter your email">

        <label for="otp">OTP:</label>
        <input
            type="text"
            id="otp"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
        >

        <button id="verifyOtp">Verify OTP</button>
    </section>

    <p id="message"></p>

</body>
</html>
